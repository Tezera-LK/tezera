version: 1
applications:
  - appRoot: apps/web
    # Deploys the Amplify backend (amplify/ at the repo root: Cognito auth and its
    # Lambdas) for this branch, then writes amplify_outputs.json into apps/web,
    # where ConfigureAmplify.tsx imports it. Commands start in appRoot, so ampx
    # runs from the repo root in a subshell.
    backend:
      phases:
        build:
          commands:
            - nvm install 24 && nvm use 24
            - corepack enable
            - pnpm install --frozen-lockfile
            - (cd ../.. && pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir apps/web)
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 24 && nvm use 24
            - corepack enable
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - ../../node_modules/**/*