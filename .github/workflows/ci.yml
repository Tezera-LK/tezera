name: CI

# Checks every pull request into dev or main. It needs no AWS access.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      # Installs the pnpm version pinned in the root package.json ("packageManager").
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # amplify_outputs.json is generated by ampx and gitignored. CI has no AWS
      # access, so write a placeholder with the same shape for typecheck and build.
      - name: Placeholder Amplify outputs
        run: |
          echo '{"version":"1.4","auth":{"aws_region":"us-east-1","user_pool_id":"us-east-1_placeholder","user_pool_client_id":"placeholder","identity_pool_id":"us-east-1:00000000-0000-0000-0000-000000000000"}}' > apps/web/amplify_outputs.json

      # Lint, typecheck and build every workspace package (web, api, infra) through Turbo.
      - name: Lint, typecheck and build
        run: pnpm exec turbo run lint typecheck build

      # Bundles the API the way a deploy would and checks the CDK app is valid.
      # Nothing is sent to AWS.
      - name: CDK synth (dev and main)
        working-directory: infra
        run: |
          pnpm run synth -c stage=dev --quiet
          pnpm run synth -c stage=main --quiet
